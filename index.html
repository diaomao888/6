<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六爻算卦系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #D4AF37;
            --secondary: #B8860B;
            --accent: #FFD700;
            --dark: #1a1a1a;
            --darker: #000000;
            --light: #2a2a2a;
            --text: #D4AF37;
            --text-light: #FFD700;
            --shadow: rgba(0, 0, 0, 0.7);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 15px;
            line-height: 1.5;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 20px 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--text-light);
            border-radius: 8px;
            box-shadow: 0 5px 15px var(--shadow);
            border: 1px solid var(--primary);
            position: relative;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .input-section, .result-section {
            flex: 1;
            min-width: 300px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 5px 15px var(--shadow);
            border: 1px solid var(--primary);
        }
        
        .section-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--secondary);
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        
        .section-title i {
            color: var(--accent);
        }
        
        .question-input {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid var(--secondary);
            border-radius: 5px;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.5);
            color: var(--text);
        }
        
        .question-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .option-group {
            display: flex;
            flex-direction: column;
        }
        
        .option-label {
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-light);
            font-size: 0.9rem;
        }
        
        select, input {
            padding: 8px 10px;
            border: 1px solid var(--secondary);
            border-radius: 5px;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.5);
            color: var(--text);
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .method-steps {
            margin: 15px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            border: 1px solid var(--secondary);
        }
        
        .step-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-light);
        }
        
        .coin-result, .time-result, .number-result {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .coin-item, .time-item, .number-item {
            padding: 8px 12px;
            background: rgba(212, 175, 55, 0.2);
            border-radius: 5px;
            border: 1px solid var(--secondary);
            text-align: center;
            min-width: 60px;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
        }
        
        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: var(--darker);
        }
        
        .btn-secondary {
            background: rgba(212, 175, 55, 0.2);
            color: var(--text);
            border: 1px solid var(--secondary);
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 0.85rem;
            flex: 0;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px var(--shadow);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .result-placeholder {
            text-align: center;
            padding: 30px 15px;
            color: #666;
            font-size: 1rem;
        }
        
        .result-placeholder i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #444;
        }
        
        .gua-container {
            margin-bottom: 20px;
        }
        
        .gua-name {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 15px 0;
            color: var(--text-light);
            text-align: center;
        }
        
        .gua-symbol {
            font-size: 5rem;
            text-align: center;
            margin: 20px 0;
        }
        
        .gua-display {
            display: flex;
            flex-direction: column-reverse;
            gap: 10px;
            margin: 20px 0;
            width: 100%;
            align-items: center;
        }
        
        .gua-line {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 380px;
            justify-content: space-between;
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            border: 1px solid var(--secondary);
        }
        
        .line-number {
            font-weight: bold;
            color: var(--text-light);
            min-width: 40px;
        }
        
        .line-symbol {
            font-size: 1.5rem;
            margin: 0 5px;
            min-width: 40px;
            text-align: center;
        }
        
        .line-name {
            font-weight: bold;
            font-size: 1rem;
            color: var(--accent);
            min-width: 80px;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 5px;
            padding-left: 10px;
        }
        
        .line-code {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--text-light);
            min-width: 20px;
            text-align: center;
        }
        
        .coin-results {
            margin-top: 10px;
        }
        
        .change-indicator {
            display: inline-block;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--darker);
            text-align: center;
            line-height: 25px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .change-info {
            margin-top: 10px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        
        .copy-section {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .copy-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--secondary);
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.5);
            font-size: 0.9rem;
            color: var(--text);
        }
        
        .display-options {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .history-section {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 5px 15px var(--shadow);
            border: 1px solid var(--primary);
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 5px 0;
        }
        
        .history-header i {
            transition: transform 0.3s;
        }
        
        .history-list {
            max-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            transition: max-height 0.5s ease;
            margin-top: 10px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.5);
        }
        
        .history-list.expanded {
            max-height: 400px;
        }
        
        .history-item {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .history-content {
            flex: 1;
            margin-right: 15px;
        }
        
        .history-question {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        
        .history-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }
        
        .history-gua {
            font-weight: 600;
            color: var(--text);
        }
        
        .history-type {
            color: #888;
        }
        
        .history-date {
            color: #888;
        }
        
        .history-actions {
            display: flex;
            gap: 8px;
        }
        
        footer {
            text-align: center;
            margin-top: 25px;
            padding: 15px;
            color: rgba(212, 175, 55, 0.7);
            font-size: 0.9rem;
        }
        
        .timezone-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .timezone-btn {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--secondary);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .timezone-btn:hover {
            background: rgba(212, 175, 55, 0.3);
        }
        
        .number-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .number-inputs input {
            width: 60px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .copy-section {
                flex-direction: column;
            }
            
            .history-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .history-content {
                margin-right: 0;
                margin-bottom: 10px;
                width: 100%;
            }
            
            .history-info {
                flex-direction: column;
                gap: 5px;
            }
            
            .history-actions {
                width: 100%;
                justify-content: flex-end;
            }
            
            .number-inputs {
                flex-wrap: wrap;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease forwards;
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
        
        .hidden {
            display: none;
        }
        
        .copy-btn {
            background: rgba(212, 175, 55, 0.2);
            color: var(--text);
            border: 1px solid var(--secondary);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px var(--shadow);
        }

        .history-delete-btn {
            background: rgba(212, 175, 55, 0.2);
            color: var(--text);
            border: 1px solid var(--secondary);
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
        }
        
        .history-delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px var(--shadow);
        }
        
        .calculation-result {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            border: 1px solid var(--secondary);
        }
        
        .calculation-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 5px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 4px;
        }
        
        .calculation-item:last-child {
            margin-bottom: 0;
        }
        
        .calculation-label {
            min-width: 80px;
            font-weight: bold;
            color: var(--text-light);
        }
        
        .calculation-value {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .bagua-symbol {
            font-size: 1.5rem;
            min-width: 30px;
            text-align: center;
        }
        
        .time-number-result {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        
        .time-number-line {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 380px;
            justify-content: space-between;
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            border: 1px solid var(--secondary);
        }
        
        .time-number-label {
            font-weight: bold;
            color: var(--text-light);
            min-width: 60px;
        }
        
        .time-number-symbol {
            font-size: 1.5rem;
            margin: 0 5px;
            min-width: 40px;
            text-align: center;
        }
        
        .time-number-name {
            font-weight: bold;
            font-size: 1rem;
            color: var(--accent);
            min-width: 80px;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 5px;
            padding-left: 10px;
        }
        
        .time-number-code {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--text-light);
            min-width: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>六爻算卦系统</h1>
            <p class="subtitle">传统智慧 · 现代演绎 · 精准用神</p>
        </header>
        
        <div class="main-content">
            <section class="input-section">
                <h2 class="section-title"><i class="fas fa-question-circle"></i> 输入问题</h2>
                <textarea class="question-input" placeholder="请输入您想问的问题..."></textarea>
                
                <div class="options">
                    <div class="option-group">
                        <label class="option-label">用神选择</label>
                        <select id="godType">
                            <option value="官鬼">官鬼爻 (事业/工作/官非)</option>
                            <option value="父母">父母爻 (长辈/文书/考试)</option>
                            <option value="妻财">妻财爻 (财运/妻子/女性)</option>
                            <option value="子孙">子孙爻 (子女/晚辈/宠物)</option>
                            <option value="兄弟">兄弟爻 (兄弟朋友/竞争)</option>
                            <option value="世爻">世爻 (自身/流年)</option>
                            <option value="应爻">应爻 (他人/对方)</option>
                            <option value="一事一问">一事一问</option>
                        </select>
                    </div>
                    
                    <div class="option-group">
                        <label class="option-label">算卦方式</label>
                        <select id="method">
                            <option value="coin">金钱卦法</option>
                            <option value="time">时间起卦</option>
                            <option value="number">数字起卦</option>
                        </select>
                    </div>
                </div>
                
                <div id="methodSteps" class="method-steps">
                    <!-- 不同起卦方式的具体步骤将在这里显示 -->
                </div>
                
                <div class="display-options">
                    <div class="checkbox-container">
                        <input type="checkbox" id="showOriginalGua">
                        <label for="showOriginalGua">在复制结果中呈现本卦详细信息</label>
                    </div>
                </div>
                
                <div class="buttons">
                    <button class="btn btn-primary" id="calculateBtn">
                        <i class="fas fa-calculator"></i> 开始算卦
                    </button>
                    <button class="btn btn-secondary" id="clearBtn">
                        <i class="fas fa-eraser"></i> 清空
                    </button>
                </div>
            </section>
            
            <section class="result-section">
                <h2 class="section-title"><i class="fas fa-chart-bar"></i> 卦象结果</h2>
                
                <div id="resultContent">
                    <div class="result-placeholder">
                        <i class="fas fa-compass"></i>
                        <p>输入问题并点击"开始算卦"获取结果</p>
                    </div>
                </div>
            </section>
        </div>
        
        <section class="history-section">
            <div class="history-header" id="historyHeader">
                <h2 class="section-title" style="margin: 0; border: none; padding: 0;"><i class="fas fa-history"></i> 历史记录</h2>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="history-list" id="historyList">
                <div class="history-item">
                    <div class="history-content">
                        <div class="history-question">暂无历史记录</div>
                    </div>
                </div>
            </div>
        </section>
        
        <footer>
            <p>六爻算卦系统 &copy; 2025 | 作者：deepseekv3.1 & 狂暴貂毛</p>
        </footer>
    </div>

        // 格式化日期时间为本地日期时间字符串
        function formatDateTimeLocal(date) {
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

            document.getElementById('num3').value = Math.floor(Math.random() * 10) + 1;
        }
        
        // 获取地支时辰(1-12)
        function getDiZhiHour(hour) {
            // 将24小时制转换为地支时辰(1-12)
            return Math.floor((hour + 1) % 24 / 2) + 1;
        }
        
        // 金钱起卦 - 投掷钱币
        function throwCoin() {
            const question = questionInput.value.trim();
            if (!question) {
                alert('请输入您的问题');
                return;
            }
            
            const coinData = currentMethodData.coin;
            
            if (coinData.results.length >= 6) {
                calculateCoinOriginalGua();
                return;
            }
            
            // 模拟投掷三枚钱币
            let coins = [];
            let sum = 0;
            
            for (let j = 0; j < 3; j++) {
                const coin = Math.random() > 0.5 ? 3 : 2; // 3为阳，2为阴
                coins.push(coin);
                sum += coin;
            }
            
            // 确定爻的类型
            let line, type, isChange;
            if (sum === 6) { // 2+2+2
                line = 0; // 老阴
                type = "老阴";
                isChange = true;
            } else if (sum === 7) { // 3+2+2
                line = 1; // 少阳
                type = "少阳";
                isChange = false;
            } else if (sum === 8) { // 3+3+2
                line = 0; // 少阴
                type = "少阴";
                isChange = false;
            } else if (sum === 9) { // 3+3+3
                line = 1; // 老阳
                type = "老阳";
                isChange = true;
            }
            
            coinData.results.push({coins, type, line, isChange});
            
            // 更新显示
            updateMethodSteps();
            
            // 如果已完成六次投掷，计算本卦
            if (coinData.results.length === 6) {
                calculateCoinOriginalGua();
            }
        }
        
        // 金钱起卦 - 重新开始

            currentMethodData.coin = {

        // 金钱起卦 - 计算本卦
        function calculateCoinOriginalGua() {
            const coinData = currentMethodData.coin;
            coinData.originalGua = [];
            coinData.changes = [];
            
            for (let i = 0; i < coinData.results.length; i++) {
                coinData.originalGua.push(coinData.results[i].line);
                if (coinData.results[i].isChange) {
                    coinData.changes.push(i);
                }
            }
            
            coinData.step = 1;
        }
        
        // 时间起卦 - 演算
        function calculateTimeGua() {
            const question = questionInput.value.trim();
            if (!question) {
                alert('请输入您的问题');
                return;
            }
            
            const timeData = currentMethodData.time;
            
            // 获取时间
            let date;
            if (timeData.useCurrentTime) {
                date = new Date();
            } else {
                date = new Date(document.getElementById('customDateTime').value);
                if (isNaN(date.getTime())) {
                    alert('请选择有效的时间');
                    return;
                }
            }
            
            // 获取时区调整
            const timezone = parseInt(document.getElementById('timezone').value) || 8;
            
            // 计算真太阳时
            const trueSolarTime = new Date(date.getTime() + (timezone - 8) * 60 * 60 * 1000);
            
            const year = trueSolarTime.getFullYear();
            const month = trueSolarTime.getMonth() + 1;
            const day = trueSolarTime.getDate();
            const hour = trueSolarTime.getHours();
            const minute = trueSolarTime.getMinutes();
            
            // 获取地支时辰
            const diZhiHour = getDiZhiHour(hour);
            
            // 标准计算方法
            const upper = (year + month + day) % 8 || 8;
            const lower = (year + month + day + diZhiHour) % 8 || 8;
            const changeLine = (year + month + day + diZhiHour) % 6 || 6;
            
            // 动爻索引应该是changeLine-1（因为爻位从1开始）
            const changeIndex = changeLine - 1;
            
            // 获取上下卦的二进制表示
            const upperBinary = baguaData[upper].binary;
            const lowerBinary = baguaData[lower].binary;
            
            // 组合成六爻卦 - 上卦在前，下卦在后
            timeData.originalGua = [...upperBinary, ...lowerBinary];
            timeData.changes = [changeIndex];
            
            // 保存演算过程
            timeData.calculation = {
                upperBinary,
                upperBagua: baguaData[upper],
                lowerBinary,
                lowerBagua: baguaData[lower],
                changeLine
            };
            
            timeData.step = 1;
            
            // 更新显示
            updateMethodSteps();
        }
        
        // 数字起卦 - 演算
        function calculateNumberGua() {
            const question = questionInput.value.trim();
            if (!question) {
                alert('请输入您的问题');
                return;
            }
            
            const numberData = currentMethodData.number;
            
            let num1 = parseInt(document.getElementById('num1').value);
            let num2 = parseInt(document.getElementById('num2').value);
            let num3 = parseInt(document.getElementById('num3').value);
            
            // 验证输入
            if (isNaN(num1) || isNaN(num2) || isNaN(num3)) {
                alert('请输入三个有效的数字');
                return;
            }
            
            if (num1 < 1 || num1 > 10 || num2 < 1 || num2 > 10 || num3 < 1 || num3 > 10) {
                alert('请输入1-10之间的数字');
                return;
            }
            
            numberData.numbers = [num1, num2, num3];
            
            // 计算上卦 第一个数 % 8
            const upper = num1 % 8 || 8;
            // 计算下卦 第二个数 % 8
            const lower = num2 % 8 || 8;
            // 计算动爻 第三个数 % 6
            const changeLine = num3 % 6 || 6;
            
            // 动爻索引应该是changeLine-1（因为爻位从1开始）
            const changeIndex = changeLine - 1;
            
            // 获取上下卦的二进制表示
            const upperBinary = baguaData[upper].binary;
            const lowerBinary = baguaData[lower].binary;
            
            // 组合成六爻卦 - 上卦在前，下卦在后
            numberData.originalGua = [...upperBinary, ...lowerBinary];
            numberData.changes = [changeIndex];
            
            // 保存演算过程
            numberData.calculation = {
                upperBinary,
                upperBagua: baguaData[upper],
                lowerBinary,
                lowerBagua: baguaData[lower],
                changeLine
            };
            
            numberData.step = 1;
            
            // 更新显示
            updateMethodSteps();
        }
        
        // 算卦函数

        // 显示卦象
        function displayGua(gua, changes, guaCode, question, godType, godTypeText, methodData) {

            const guaInfo = guaData[guaCode] || { name: `卦象 ${guaCode}`, symbol: "" };

                    // 根据爻的类型和是否动爻确定符号和名称
                    if (gua[i] === 1) {
                        // 阳爻
                        if (isChange) {
                            lineSymbol = "O"; // 老阳
                            lineName = "老阳";
                        } else {
                            lineSymbol = "—"; // 少阳
                            lineName = "少阳";
                        }
                    } else {
                        // 阴爻
                        if (isChange) {
                            lineSymbol = "X"; // 老阴
                            lineName = "老阴";
                        } else {
                            lineSymbol = "- -"; // 少阴
                            lineName = "少阴";
                        }
                    }
                    
                    // 使用投币结果中的名称
                    if (methodData.results) {
                        lineName = methodData.results[i].type;
                    }
                    
                    content += `
                        <div class="gua-line">
                            <div class="line-number">${i + 1}爻</div>
                            <div class="line-symbol">${lineSymbol}</div>
                            <div class="line-name">
                                ${lineName}${isChange ? '<div class="change-indicator">动</div>' : ''}

            copyBtn.addEventListener('click', function() {
                const textToCopy = generateCopyText(question, godTypeText, guaInfo.symbol, guaInfo.name, guaCode, changes, methodData, showOriginalGuaCheckbox.checked);
                
                // 使用现代 Clipboard API
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        showCopySuccess(this);
                    }).catch(err => {
                        // 如果 Clipboard API 失败，回退到传统方法
                        fallbackCopy(textToCopy, this);
                    });
                } else {
                    // 使用传统的 execCommand
                    fallbackCopy(textToCopy, this);
                }
            });
            
            // 添加动画效果
            document.querySelector('.result-section').classList.add('fade-in');
            setTimeout(() => {
                document.querySelector('.result-section').classList.remove('fade-in');
            }, 300);
        }
        
        // 传统复制方法
        function fallbackCopy(text, button) {
            // 创建临时 textarea 元素
            const textArea = document.createElement("textarea");
            textArea.value = text;
            
            // 避免屏幕闪烁
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                if (successful) {
                    showCopySuccess(button);
                } else {
                    alert('复制失败，请手动选择文本并复制');
                }
            } catch (err) {
                console.error('复制失败:', err);
                document.body.removeChild(textArea);
                alert('复制失败，请手动选择文本并复制');
            }
        }
        
        // 显示复制成功提示
        function showCopySuccess(button) {
            const originalHTML = button.innerHTML;
            const originalColor = button.style.color;
            const originalBackground = button.style.background;
            
            button.innerHTML = '<i class="fas fa-check"></i>';
            button.style.color = '#2ecc71';
            button.style.background = 'rgba(46, 204, 113, 0.2)';
            
            setTimeout(() => {
                button.innerHTML = originalHTML;
                button.style.color = originalColor;
                button.style.background = originalBackground;
            }, 2000);
        }
        
        // 生成复制文本
        function generateCopyText(question, godTypeText, guaSymbol, guaName, guaCode, changes, methodData, showOriginal) {
            let changeText = '无';
            if (changes.length > 0) {
                changeText = changes.map(pos => `${pos + 1}爻`).join('、');
            }
            
            let result = `【问题】${question}\n【用神】${godTypeText}\n【卦象】${guaSymbol} ${guaName} ${guaCode}\n【动爻】${changeText}`;
            
            // 如果勾选了显示本卦详细信息
            if (showOriginal) {
                result += `\n【本卦】`;
                
                // 根据起卦方式添加不同的本卦信息
                if (methodData.results) {
                    // 金钱起卦 - 显示六组爻
                    result += methodData.results.map((r, i) => {
                        const isChange = methodData.changes.includes(i);
                        let lineSymbol = r.type === "老阳" || r.type === "少阳" ? "—" : "- -";
                        return `${i+1}爻: ${lineSymbol} ${r.type} ${r.coins.join('')}${isChange ? ' 动爻' : ''}`;
                    }).join('\n');
                } else if (methodData.calculation) {
                    // 时间/数字起卦 - 显示上下卦和动爻
                    const calc = methodData.calculation;
                    result += `\n上卦: ${calc.upperBagua.symbol} ${calc.upperBagua.name} ${calc.upperBinary.join('')}`;
                    result += `\n下卦: ${calc.lowerBagua.symbol} ${calc.lowerBagua.name} ${calc.lowerBinary.join('')}`;
                    result += `\n动爻: ${calc.changeLine}爻`;
                }
            }
            
            return result;
        }
        
        // 清空问题
        function clearQuestion() {
            questionInput.value = '';
            questionInput.focus();
        }
        
        // 切换历史记录显示
        function toggleHistory() {
            const icon = historyHeader.querySelector('i');
            historyList.classList.toggle('expanded');
            icon.style.transform = historyList.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0)';
        }
        
        // 保存到历史记录
        function saveToHistory(question, guaCode, godType, godTypeText, changes, methodData) {
            const guaInfo = guaData[guaCode] || { name: `卦象 ${guaCode}`, symbol: "" };
            
            history.unshift({
                question: question,
                guaName: guaInfo.name,
                guaSymbol: guaInfo.symbol,
                guaCode: guaCode,
                godType: godType,
                godTypeText: godTypeText,
                changes: changes,
                methodData: methodData,
                date: new Date().toLocaleString()
            });
            
            // 只保留最近10条记录
            if (history.length > 10) {
                history.pop();
            }
            
            // 保存到本地存储
            localStorage.setItem('liuyaoHistory', JSON.stringify(history));
            
            // 更新历史记录列表
            updateHistoryList();
        }
        
        // 更新历史记录列表
        function updateHistoryList() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-item"><div class="history-content"><div class="history-question">暂无历史记录</div></div></div>';
                return;
            }
            
            let historyHTML = '';
            history.forEach((item, index) => {
                let changeText = '无';
                if (item.changes && item.changes.length > 0) {
                    changeText = item.changes.map(pos => `${pos + 1}爻`).join('、');
                }
                
                historyHTML += `
                    <div class="history-item">
                        <div class="history-content">
                            <div class="history-question">${item.question}</div>
                            <div class="history-info">
                                <div class="history-gua">${item.guaSymbol} ${item.guaName} ${item.guaCode}</div>
                                <div class="history-type">${item.godTypeText}</div>
                                <div class="history-date">${item.date}</div>
                            </div>
                            <div class="history-info">
                                <div>动爻: ${changeText}</div>
                            </div>
                        </div>
                        <div class="history-actions">
                            <button class="history-delete-btn" data-index="${index}">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                            <button class="btn btn-secondary btn-small history-copy-btn" data-index="${index}">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            historyList.innerHTML = historyHTML;
            
            // 为历史记录删除按钮添加事件
            document.querySelectorAll('.history-delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = this.getAttribute('data-index');
                    const originalIcon = this.innerHTML;
                    
                    // 立即显示删除反馈
                    this.innerHTML = '<i class="fas fa-times"></i>';
                    this.style.background = 'rgba(231, 76, 60, 0.2)';
                    this.style.color = '#e74c3c';
                    
                    // 短暂延迟后执行删除
                    setTimeout(() => {
                        history.splice(index, 1);
                        localStorage.setItem('liuyaoHistory', JSON.stringify(history));
                        updateHistoryList();
                    }, 500);
                });
            });
            
            // 为历史记录复制按钮添加事件
            document.querySelectorAll('.history-copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = this.getAttribute('data-index');
                    const item = history[index];
                    const copyText = generateCopyText(item.question, item.godTypeText, item.guaSymbol, item.guaName, item.guaCode, item.changes, item.methodData, showOriginalGuaCheckbox.checked);
                    
                    // 使用现代 Clipboard API
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(copyText).then(() => {
                            showHistoryCopySuccess(this);
                        }).catch(err => {
                            // 如果 Clipboard API 失败，回退到传统方法
                            fallbackCopy(copyText, this);
                        });
                    } else {
                        // 使用传统的 execCommand
                        fallbackCopy(copyText, this);
                    }
                });
            });
        }
        
        // 显示历史记录复制成功提示
        function showHistoryCopySuccess(button) {
            const originalHTML = button.innerHTML;
            const originalColor = button.style.color;
            const originalBackground = button.style.background;
            
            button.innerHTML = '<i class="fas fa-check"></i>';
            button.style.color = '#2ecc71';
            button.style.background = 'rgba(46, 204, 113, 0.2)';
            
            setTimeout(() => {
                button.innerHTML = originalHTML;
                button.style.color = originalColor;
                button.style.background = originalBackground;
            }, 2000);
        }
    </script>
</body>
